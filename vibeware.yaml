# Authority contract for Hypercolor web (Vibeware playbook §3).
# The loop may watch how the product is used. It may not watch what
# people say, hold, or spend. Forbidden paths are outside every surface.
#
# Actor on every evidence event is a cohort key (experimental | internal |
# opted_in). A pubky field is never allowed. See docs/vibeware.md.

app: hypercolor-web
owner: hypercolor

# v1 collector allowlist — one source of truth for CI and the later collector.
# Unknown event types are dropped. Payloads stay coarse (plan Phase 1).
evidence_allowlist:
  - app.route.viewed
  - app.onboarding.state
  - app.onboarding.abandoned
  - app.chat.empty_state
  - app.thread.send_settled
  - app.request.decision
  - app.backup.export_outcome
  - app.error.coarse
  - app.pwa.installed

max_payload_bytes: 256
privacy:
  contains_user_content: false

# Per-event field allowlists. Extra keys are rejected. Collector is P1;
# this schema is P0 so P1 cannot widen silently.
evidence_payloads:
  app.route.viewed:
    fields:
      - route
      - from_route
  app.onboarding.state:
    fields:
      - state
  app.onboarding.abandoned:
    fields:
      - step
  app.chat.empty_state:
    fields:
      - kind
  app.thread.send_settled:
    fields:
      - channel
      - outcome
      - kind
  app.request.decision:
    fields:
      - kind
      - decision
  app.backup.export_outcome:
    fields:
      - outcome
  app.error.coarse:
    fields:
      - code
      - surface
  app.pwa.installed:
    fields:
      - outcome

# Shared Gate B + Gate C. A file matching both writable and forbidden is forbidden.
forbidden_paths:
  - src/services/link/session.ts
  - src/services/RingConnect.ts
  - src/services/ringChannelId.ts
  - src/lib/app-origin.ts
  - src/lib/capabilities.ts
  - src/services/link/PaykitLinkWeb.ts
  - src/services/link/LinkService.ts
  - src/services/link/provisionReceiver.ts
  - src/services/link/wotGate.ts
  - src/services/link/inboundEnvelope.ts
  - src/services/KeyStore.ts
  - src/services/attachments/xchacha.ts
  - src/services/backup/crypto.ts
  - vendor/paykit-wasm/**
  - src/types/**
  - src/services/group/applyGroupInbound.ts
  - src/services/attachments/applyAttachmentInbound.ts
  - src/lib/group-invites.ts
  - src/services/payments/**
  - vibeware.yaml
  - scripts/check-vibeware*
  - scripts/vibeware-evidence.mjs
  - .github/**
  - src/components/ring-callback-page.tsx
  - src/components/session-bootstrap.tsx
  - src/components/pwa-register.tsx
  - src/components/enable-messaging-cta.tsx
  - src/services/backup/**
  - src/services/link/stagingSignup.ts
  - src/services/link/dmHarness.ts
  - src/services/link/groupHarness.ts
  - src/services/link/ownerRoundtrip.ts
  - src/services/onboarding/enableActions.tsx
  - src/services/onboarding/welcomeActions.tsx
  - src/services/thread/threadActions.tsx
  - src/services/chats/chatsPageHost.tsx
  - src/components/auth-url-actions.tsx
  - src/hooks/useThread.ts
  - src/hooks/useAuthUrl.ts
  - src/hooks/usePaykitConnect.ts
  - src/hooks/useInbox.ts
  - src/hooks/useChannel.ts
  - src/hooks/useSignOut.ts
  - package.json
  - package-lock.json
  - scripts/copy-sqlite-wasm.mjs
  - src/services/contacts/addManualContact.ts
  - src/services/group/GroupService.ts
  - src/services/StorageService.ts
  - src/stores/inboxStore.ts
  - src/services/vibeware/**

surfaces:
  - surface:
      id: hc-chats-ui
      owner: hypercolor
      risk: 1
    scope:
      repositories:
        - BitcoinErrorLog/hypercolor-web
      # Inbox chrome only. inboxStore.ts applies excludeHeldFounderChannels
      # and inbox.ts can preview group bodies — both stay unwritable.
      writable_paths:
        - src/components/chats-page.tsx
      forbidden_paths:
        - src/stores/inboxStore.ts
        - src/lib/inbox.ts
    evidence:
      allowed:
        - app.route.viewed
        - app.chat.empty_state
        - app.error.coarse
      forbidden:
        - private_message_body
        - raw_auth_token
        - seed_material
        - payment_details
        - recovery_code
        - attachment_bytes
    exposure:
      allowed_cohorts:
        - experimental
        - internal
        - opted_in
      max_initial_percent: 10
      requires_human_for_percent_over: 25
    selection:
      primary_metric: empty_state_escape_rate
      guardrails:
        - app.error.coarse
        - send_settle_failed_rate
      minimum_exposure_hours: 48
    autonomy:
      max_level: expose
      auto_merge: false
      auto_promote: false
    kill_switch:
      flag: hc-chats-ui-vibeware-enabled

  - surface:
      id: hc-thread-ui
      owner: hypercolor
      risk: 1
    scope:
      repositories:
        - BitcoinErrorLog/hypercolor-web
      writable_paths:
        - src/components/thread-view.tsx
        - src/components/composer.tsx
        - src/components/message-bubble.tsx
      forbidden_paths:
        - src/components/attachment-bubble.tsx
    evidence:
      allowed:
        - app.thread.send_settled
        - app.error.coarse
      forbidden:
        - private_message_body
        - raw_auth_token
        - seed_material
        - payment_details
        - recovery_code
        - attachment_bytes
    exposure:
      allowed_cohorts:
        - experimental
        - internal
        - opted_in
      max_initial_percent: 10
      requires_human_for_percent_over: 25
    selection:
      primary_metric: send_settle_success
      guardrails:
        - app.error.coarse
        - send_settle_failed_rate
      minimum_exposure_hours: 48
    autonomy:
      max_level: expose
      auto_merge: false
      auto_promote: false
    kill_switch:
      flag: hc-thread-ui-vibeware-enabled

  - surface:
      id: hc-onboarding-ui
      owner: hypercolor
      risk: 1
    scope:
      repositories:
        - BitcoinErrorLog/hypercolor-web
      writable_paths:
        - src/components/welcome-page.tsx
        - src/components/enable-page.tsx
        - src/components/auth-qr.tsx
        - src/components/auth-url-panel.tsx
      forbidden_paths:
        - src/services/RingConnect.ts
        - src/services/link/session.ts
    evidence:
      allowed:
        - app.onboarding.state
        - app.onboarding.abandoned
        - app.pwa.installed
      forbidden:
        - private_message_body
        - raw_auth_token
        - seed_material
        - payment_details
        - recovery_code
        - attachment_bytes
    exposure:
      allowed_cohorts:
        - experimental
        - internal
        - opted_in
      max_initial_percent: 10
      requires_human_for_percent_over: 25
    selection:
      primary_metric: onboarding_completion_rate
      guardrails:
        - app.error.coarse
        - onboarding_abandoned_rate
      minimum_exposure_hours: 48
    autonomy:
      max_level: expose
      auto_merge: false
      auto_promote: false
    kill_switch:
      flag: hc-onboarding-ui-vibeware-enabled
