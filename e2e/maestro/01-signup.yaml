# Single mobile identity B: debug signup already publishes the receiver marker.
# Print pubky before Continue so later UI flakes cannot hide it.
appId: ${APP_ID}
---
- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          text: "Open debugger to view warnings."
          optional: true
- extendedWaitUntil:
    visible:
      id: welcomeScreen
    timeout: 60000
- scrollUntilVisible:
    element:
      id: debugSignupHomeserver
    direction: DOWN
    timeout: 15000
- tapOn:
    id: debugSignupHomeserver
- eraseText
- inputText: ${HOMESERVER_PUBKY}
- hideKeyboard
- assertVisible: ${HOMESERVER_PUBKY}
- tapOn:
    id: debugSignupToken
- eraseText
- inputText: ${SIGNUP_TOKEN}
- hideKeyboard
- tapOn:
    id: debugSignupSubmit
- extendedWaitUntil:
    visible:
      id: debugSignupContinue
    timeout: 120000
- copyTextFrom:
    id: debugSignupPubky
- hideKeyboard
- scrollUntilVisible:
    element:
      id: debugSignupContinue
    direction: DOWN
    timeout: 15000
- tapOn:
    id: debugSignupContinue
- extendedWaitUntil:
    visible:
      id: chatsScreen
    timeout: 30000
