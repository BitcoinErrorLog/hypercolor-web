# Re-enter Chats so syncInbox probes the known web peer, then assert the A→B body.
appId: ${APP_ID}
---
- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          point: "415,893"
          optional: true
- tapOn:
    id: threadBack
- tapOn:
    id: tabChats
- extendedWaitUntil:
    visible:
      id: chatRow
    timeout: 180000
- tapOn:
    id: chatRow
- extendedWaitUntil:
    visible:
      id: threadScreen
    timeout: 30000
- extendedWaitUntil:
    visible: ${WEB_BODY}
    timeout: 180000
