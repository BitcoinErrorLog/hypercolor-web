name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout hypercolor-web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR shas for vibeware diff
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

      - name: Checkout Hypercolor wire pin
        uses: actions/checkout@v4
        with:
          repository: BitcoinErrorLog/hypercolor
          ref: c7157aaa1b338dd1d8545e82f639007cba945631
          path: .cache/hypercolor-pin
          token: ${{ secrets.HYPERCOLOR_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Vibeware path-policy self-test
        run: npm run check:vibeware

      - name: Vibeware PR path-policy
        env:
          VIBEWARE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VIBEWARE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          VIBEWARE_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: npm run check:vibeware:pr -- --base "$VIBEWARE_BASE" --head "$VIBEWARE_HEAD" --head-ref "$VIBEWARE_HEAD_REF"

      - name: Unit tests
        run: npm test

      - name: paykit-wasm smoke
        run: node scripts/paykit-wasm-smoke.mjs

      - name: Wire-contract drift
        env:
          HYPERCOLOR_REPO: ${{ github.workspace }}/.cache/hypercolor-pin
        run: bash scripts/check-wire-drift.sh
