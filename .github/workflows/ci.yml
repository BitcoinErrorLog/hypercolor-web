name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout hypercolor-web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR shas for vibeware diff
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Extract base vibeware gate outside workspace
        if: github.event_name == 'pull_request'
        env:
          VIBEWARE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          VIBEWARE_BASE_DIR="${RUNNER_TEMP}/vibeware-base-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$VIBEWARE_BASE_DIR"
          git archive "$VIBEWARE_BASE" | tar -x -C "$VIBEWARE_BASE_DIR"
          test -f "$VIBEWARE_BASE_DIR/scripts/check-vibeware-pr.mjs"
          test -f "$VIBEWARE_BASE_DIR/scripts/check-vibeware-selftest.mjs"
          test -f "$VIBEWARE_BASE_DIR/scripts/check-vibeware-writable-imports.mjs"

      - name: Vibeware PR gates from base tree
        if: github.event_name == 'pull_request'
        env:
          VIBEWARE_BASE: ${{ github.event.pull_request.base.sha }}
          VIBEWARE_HEAD: ${{ github.event.pull_request.head.sha }}
          VIBEWARE_HEAD_REF: ${{ github.head_ref }}
        run: |
          VIBEWARE_BASE_DIR="${RUNNER_TEMP}/vibeware-base-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node "$VIBEWARE_BASE_DIR/scripts/check-vibeware-pr.mjs" \
            --repo "$GITHUB_WORKSPACE" \
            --base "$VIBEWARE_BASE" \
            --head "$VIBEWARE_HEAD" \
            --head-ref "$VIBEWARE_HEAD_REF"
          case "${VIBEWARE_HEAD_REF}" in
            vibeware/*|candidate/*)
              node "$VIBEWARE_BASE_DIR/scripts/check-vibeware-selftest.mjs"
              node "$VIBEWARE_BASE_DIR/scripts/check-vibeware-writable-imports.mjs" \
                --repo "$GITHUB_WORKSPACE"
              ;;
          esac

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Vibeware path-policy self-test
        run: npm run check:vibeware

      - name: Unit tests
        run: npm test

      - name: paykit-wasm smoke
        run: node scripts/paykit-wasm-smoke.mjs

      - name: Wire-contract drift
        env:
          HYPERCOLOR_REPO: vendor/hypercolor-wire-pin
        run: bash scripts/check-wire-drift.sh

  production-hooks:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
      options: --ipc=host
    env:
      PLAYWRIGHT_IN_DOCKER: "1"
      COPYFILE_DISABLE: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    permissions:
      contents: read
    steps:
      - name: Checkout hypercolor-web
        uses: actions/checkout@v4

      - name: Native module build tools
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 make g++

      - name: Install
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Assert production client output has zero live harness hooks
        env:
          HYPERCOLOR_ASSERT_PRODUCTION_OUT: "1"
          # Filesystem-only spec — any base URL disables playwright webServer.
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:9"
        run: npx playwright test e2e/production-hooks.spec.ts

      - name: Static e2e suite
        run: npm run test:e2e:static

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-hooks-e2e
          path: |
            test-results/
            playwright-report/
            ux-vrt-report/
          if-no-files-found: ignore

  # Native jammy/amd64 snapshot regen. Docker Desktop qemu-user writes uniform
  # black 1280-wide Chromium PNGs; this job is the raster source of truth.
  vrt-update:
    if: >
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[vrt-update]')) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[vrt-update]'))
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
      options: --ipc=host
    env:
      PLAYWRIGHT_IN_DOCKER: "1"
      COPYFILE_DISABLE: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    permissions:
      contents: read
    steps:
      - name: Checkout hypercolor-web
        uses: actions/checkout@v4

      - name: Native module build tools
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 make g++

      - name: Install
        run: npm ci

      - name: Regenerate VRT baselines
        run: npm run vrt:update:native

      - name: Upload jammy VRT baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-baselines
          path: e2e/vrt-baselines
          if-no-files-found: error
          retention-days: 7
